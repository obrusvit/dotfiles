# default prefix set to Ctrl + b
set-option -g prefix C-b
# second prefix set to Alt + b
set-option -g prefix2 M-b

# Start window indexing at 1
set -g base-index 1

# Start pane indexing at 1
set -g pane-base-index 1

# Default terminal is 256 colors
set -g default-terminal "screen-256color"
# Add truecolor support
set-option -ga terminal-overrides ",xterm-256color:Tc"

set-option -g history-limit 10000

set -g mouse on

# set status keys to vi mode and copy via xclip
setw -g mode-keys vi

### Copy-mode bindings ###
# Use 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank bindings that copy to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"

# Tmux Plugins Manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Tmux Resurrect (to save and resurrect sessions)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Solarized color theme for tmux
set -g @plugin 'seebi/tmux-colors-solarized'
# and setting
# set -g @colors-solarized '256' # default
set -g @colors-solarized 'dark'

# yazi image-preview, see https://yazi-rs.github.io/docs/image-preview/#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
